require conf/distro/poky.conf

# Keep Poky's release metadata from the selected Yocto branch.
DISTRO = "chargebyte"
DISTRO_NAME = "chargebyte OS"
MAINTAINER = "chargebyte <support@chargebyte.com>"
TARGET_VENDOR = "-chargebyte"
SDK_VENDOR = "-chargebytesdk"

# Distribution-wide product policy, moved here from
# chargebyte-bsp-internal/conf/local.conf so it lives with the distro
# identity rather than the build-tree config.
PACKAGE_CLASSES ?= "package_deb"

DISTRO_FEATURES:remove = " \
    alsa \
    bluetooth \
    bluez5 \
    gobject-introspection-data \
    pci \
    pcmcia \
    ptest \
    pulseaudio \
    vulkan \
    wayland \
    wifi \
    x11 \
"

DISTRO_FEATURES:append = " systemd rauc usrmerge"
DISTRO_FEATURES_OPTED_OUT += " sysvinit pulseaudio bluez5 gobject-introspection-data"
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_update-alternatives = ""
INIT_MANAGER = "systemd"
