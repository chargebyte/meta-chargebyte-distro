server.modules += ( "mod_openssl" )

# Add HTTPS alongside the HTTP listener on port 80.
# Provision these files before starting lighttpd. Keep the private key readable
# by www-data only (for example, mode 0640 with group www-data).
$SERVER["socket"] == ":443" {
    ssl.engine = "enable"
    ssl.pemfile = "/etc/lighttpd/certs/server.crt"
    ssl.privkey = "/etc/lighttpd/certs/server.key"
    ssl.openssl.ssl-conf-cmd = (
        "MinProtocol" => "TLSv1.2",
        "CipherString" => "ECDHE+AESGCM:ECDHE+CHACHA20",
        "Options" => "-SessionTicket",
    )
}

# Add an IPv6-only HTTPS listener alongside the IPv4 listener above.
$SERVER["socket"] == "[::]:443" {
    server.v4mapped = "disable"
    ssl.engine = "enable"
    ssl.pemfile = "/etc/lighttpd/certs/server.crt"
    ssl.privkey = "/etc/lighttpd/certs/server.key"
    ssl.openssl.ssl-conf-cmd = (
        "MinProtocol" => "TLSv1.2",
        "CipherString" => "ECDHE+AESGCM:ECDHE+CHACHA20",
        "Options" => "-SessionTicket",
    )
}
