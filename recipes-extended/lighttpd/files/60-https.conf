server.modules += ( "mod_openssl" )

# Add HTTPS alongside the HTTP listener on port 80.
# Provision these files before starting lighttpd.
$SERVER["socket"] == ":443" {
    ssl.engine = "enable"
    ssl.pemfile = "/etc/lighttpd/certs/server.crt"
    ssl.privkey = "/etc/lighttpd/certs/server.key"
    ssl.openssl.ssl-conf-cmd = (
        "MinProtocol" => "TLSv1.2",
        "CipherString" => "ECDHE+AESGCM:ECDHE+CHACHA20",
        "Options" => "-SessionTicket",
    )
}
