server.modules = (
	"mod_access",
	"mod_alias",
	"mod_proxy",
	"mod_auth",
	"mod_authn_file",
	"mod_dirlisting",
	"mod_rewrite",
	"mod_redirect",
)

server.document-root = "/www"
server.upload-dirs   = ( "/var/cache/lighttpd/uploads" )
server.errorlog      = "/var/log/lighttpd/error.log"
server.pid-file      = "/var/run/lighttpd/lighttpd.pid"
server.username      = "www-data"
server.groupname     = "www-data"
server.port          = 80
server.tag           = "lighttpd"

# Limit ordinary requests to 16 MiB; uploadprogress overrides this for large uploads.
server.max-request-size = 16384
server.follow-symlink = "enable"

# Load configuration fragments in filename order, including optional features.
include "/etc/lighttpd.d/*.conf"

# files to check for if .../ is requested
index-file.names            = ( "index.php", "index.html",
                                "index.htm", "default.htm" )

# Block hidden path components (including .git and .env), editor files and backups.
# .well-known is intentionally blocked too; add a narrow exception if required.
$HTTP["url"] =~ "(^|/)[.]|(~|(?i:[.](inc|bak|bkp|backup|old|orig|rej|save|swp|swo|tmp)))($|/)|(^|/)#[^/]*#($|/)" {
    url.access-deny = ( "" )
}

##
# which extensions should not be handle via static-file transfer
#
# .php, .pl, .fcgi are most often handled by mod_fastcgi or mod_cgi
static-file.exclude-extensions = ( ".php", ".pl", ".fcgi" )

# Use the "Content-Type" extended attribute to obtain mime type if possible
#mimetype.use-xattr        = "enable"
