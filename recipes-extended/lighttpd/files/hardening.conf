[Service]
# Run lighttpd as the owner of the systemd-managed log and cache directories.
# This also keeps existing log and upload files writable across restarts.
User=www-data
Group=www-data

# Permit binding HTTP and optional HTTPS without starting as root.
AmbientCapabilities=CAP_NET_BIND_SERVICE

RuntimeDirectory=lighttpd
RuntimeDirectoryMode=0770
LogsDirectory=lighttpd
LogsDirectoryMode=0775
CacheDirectory=lighttpd
CacheDirectoryMode=0775

ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
LockPersonality=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
