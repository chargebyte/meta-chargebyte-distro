[Service]
# Create the PHP socket/PID directory before entering the filesystem sandbox.
# lighttpd starts as root and drops privileges itself; keep its primary group
# consistent with the runtime directory's group ownership.
Group=www-data
RuntimeDirectory=lighttpd
RuntimeDirectoryMode=0770

NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
LockPersonality=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
CapabilityBoundingSet=CAP_NET_BIND_SERVICE CAP_SETUID CAP_SETGID CAP_DAC_OVERRIDE
ReadWritePaths=/run/lighttpd /var/log/lighttpd /var/cache/lighttpd
